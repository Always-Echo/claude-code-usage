<h2>菜单栏图标显示内容</h2>
<p class="subtitle">菜单栏图标旁边显示什么文字摘要？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仅图标，无文字</h3>
      <p>菜单栏只显示一个图标（如 ◆ 或 $ 符号），点击后才展开详情。简洁不占空间。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>图标 + 今日花费</h3>
      <p>如：<strong>◆ $0.42</strong>　显示今日累计 USD 花费，一眼看到最关心的数字。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>图标 + 今日 Token 数</h3>
      <p>如：<strong>◆ 128k</strong>　显示今日总 token 用量，适合更关注用量而非费用的用户。</p>
    </div>
  </div>
</div>
